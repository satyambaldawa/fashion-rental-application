spring:
  application:
    name: fashion-rental
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 10MB
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      # Fixed-size warm pool (minimum-idle defaults to maximum-pool-size) so connections
      # stay open — avoids paying the DB region's TCP+TLS handshake on every idle→active
      # request. The Neon-era minimum-idle:0 / idle-timeout drained the pool to let Neon's
      # compute scale to zero; Supabase has no compute-hour meter, so warm is better.
      # maximum-pool-size stays small for the e2-micro's memory budget.
      maximum-pool-size: 5
      keepalive-time: 120000     # ping idle connections so the Supabase pooler keeps them
      connection-timeout: 10000  # fail fast when the DB is unreachable (health + requests)
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080

app:
  cors:
    allowed-origins: ${ALLOWED_ORIGINS}
  jwt:
    secret: ${JWT_SECRET}
    expiration-hours: 24
  auth:
    username: ${APP_USERNAME}
    password: ${APP_PASSWORD}
  storage:
    r2:
      account-id: ${R2_ACCOUNT_ID:dev}
      access-key-id: ${R2_ACCESS_KEY_ID:dev}
      secret-access-key: ${R2_SECRET_ACCESS_KEY:dev}
      bucket-name: ${R2_BUCKET_NAME:dev}
      public-url-base: ${R2_PUBLIC_URL_BASE:http://localhost:9000}
    image:
      max-upload-bytes: 15728640
      full-max-px: 1200
      thumb-max-px: 300
      max-photos-per-item: 8

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      # Liveness = process only (Docker health check targets this; a DB outage must
      # NOT mark the container unhealthy — restarting never fixes a DB problem).
      # Readiness + the aggregate /actuator/health include the DB, so an outage is
      # visible instead of hiding behind a blind 200.
      group:
        readiness:
          include: readinessState, db

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

logging:
  level:
    com.fashionrental: INFO
    org.springframework.security: WARN
