name: DB Migrate (Neon → Supabase)

# One-time, manual migration.
#   mode=check   → verify connectivity to both DBs and print row counts (NO writes)
#   mode=migrate → pg_dump Neon and restore into Supabase, then verify row counts match
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'check = connectivity + counts (no writes); migrate = dump Neon → restore Supabase'
        type: choice
        options: [check, migrate]
        default: check

jobs:
  migrate:
    name: ${{ inputs.mode }}
    runs-on: ubuntu-latest
    environment: Prod
    steps:
      - name: Tool versions
        run: |
          pg_dump --version
          psql --version

      - name: Build connection strings (no passwords embedded)
        env:
          NEON_URL: ${{ secrets.DATABASE_URL }}
          NEON_USER: ${{ secrets.DATABASE_USERNAME }}
          SUPA_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
          SUPA_USER: ${{ secrets.SUPABASE_DATABASE_USERNAME }}
        run: |
          set -euo pipefail
          # Rebuild a clean libpq URI from a JDBC URL + username secret, regardless of
          # whether the URL already carries a user or JDBC-only query params.
          build_conn() {   # $1=url  $2=user
            local raw="${1#jdbc:}"; local np="${raw#postgresql://}"
            local hostportdb="${np#*@}"; hostportdb="${hostportdb%%\?*}"
            printf 'postgresql://%s@%s?sslmode=require' "$2" "$hostportdb"
          }
          {
            echo "NEON_CONN=$(build_conn "$NEON_URL" "$NEON_USER")"
            echo "SUPA_CONN=$(build_conn "$SUPA_URL" "$SUPA_USER")"
          } >> "$GITHUB_ENV"

      - name: Connectivity + row counts (both DBs, read-only)
        env:
          NEON_PASS: ${{ secrets.DATABASE_PASSWORD }}
          SUPA_PASS: ${{ secrets.SUPABASE_DATABASE_PASSWORD }}
        run: |
          set -euo pipefail
          report() {   # $1=label  $2=conn  $3=pass
            echo "### $1"
            echo "  server: $(PGPASSWORD="$3" psql "$2" -tAc 'select version()' | cut -c1-40)"
            for t in $(PGPASSWORD="$3" psql "$2" -tAc \
                "select tablename from pg_tables where schemaname='public' order by tablename"); do
              c=$(PGPASSWORD="$3" psql "$2" -tAc "select count(*) from \"$t\"")
              printf '  %-30s %s\n' "$t" "$c"
            done
          }
          report "NEON (source)"     "$NEON_CONN" "$NEON_PASS"
          echo ""
          report "SUPABASE (target)" "$SUPA_CONN" "$SUPA_PASS"

      - name: Dump Neon → restore into Supabase
        if: inputs.mode == 'migrate'
        env:
          NEON_PASS: ${{ secrets.DATABASE_PASSWORD }}
          SUPA_PASS: ${{ secrets.SUPABASE_DATABASE_PASSWORD }}
        run: |
          set -euo pipefail
          echo "Dumping Neon (schema + data, no owner/privileges)…"
          PGPASSWORD="$NEON_PASS" pg_dump "$NEON_CONN" --no-owner --no-privileges > neon-dump.sql
          echo "  dump: $(wc -l < neon-dump.sql) lines, $(du -h neon-dump.sql | cut -f1)"

          echo "Restoring into Supabase…"
          PGPASSWORD="$SUPA_PASS" psql "$SUPA_CONN" -v ON_ERROR_STOP=0 -f neon-dump.sql \
            > restore.log 2>&1 || true
          echo "  restore errors (if any):"
          grep -iE '^ERROR' restore.log | grep -viE 'already exists' | head -20 || echo "  (none)"

      - name: Verify row counts match
        if: inputs.mode == 'migrate'
        env:
          NEON_PASS: ${{ secrets.DATABASE_PASSWORD }}
          SUPA_PASS: ${{ secrets.SUPABASE_DATABASE_PASSWORD }}
        run: |
          set -euo pipefail
          counts() {   # $1=conn  $2=pass
            for t in $(PGPASSWORD="$2" psql "$1" -tAc \
                "select tablename from pg_tables where schemaname='public' order by tablename"); do
              echo "$t $(PGPASSWORD="$2" psql "$1" -tAc "select count(*) from \"$t\"")"
            done
          }
          counts "$NEON_CONN" "$NEON_PASS" | sort > neon.counts
          counts "$SUPA_CONN" "$SUPA_PASS" | sort > supa.counts
          echo "=== per-table row counts (Neon vs Supabase) ==="
          if diff neon.counts supa.counts; then
            echo "✔ Row counts match exactly — migration verified."
          else
            echo "✖ Row-count MISMATCH (see diff above)."
            exit 1
          fi
