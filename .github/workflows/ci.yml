name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Run unit tests
        run: cd backend && ./gradlew test

      # GitHub-hosted runners have Docker running, so Testcontainers spins up
      # a throwaway Postgres with no extra setup — no `services:` block needed.
      - name: Run integration tests (Testcontainers → PostgreSQL)
        run: cd backend && ./gradlew integrationTest

      # Report-only: generates coverage and posts a summary, never fails the build.
      - name: Coverage report (JaCoCo)
        if: always()
        run: cd backend && ./gradlew jacocoTestReport

      - name: Publish backend coverage summary
        if: always()
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import csv
          rows = list(csv.DictReader(open("backend/build/reports/jacoco/test/jacocoTestReport.csv")))
          def pct(missed, covered):
              m = sum(int(r[missed]) for r in rows); c = sum(int(r[covered]) for r in rows)
              return c, c + m, (100 * c / (c + m) if c + m else 0)
          print("### Backend coverage (JaCoCo · unit + integration · report-only)\n")
          print("| Metric | Coverage |")
          print("|---|---|")
          for label, mi, co in [("Lines", "LINE_MISSED", "LINE_COVERED"),
                                ("Instructions", "INSTRUCTION_MISSED", "INSTRUCTION_COVERED"),
                                ("Branches", "BRANCH_MISSED", "BRANCH_COVERED")]:
              c, t, p = pct(mi, co); print(f"| {label} | {p:.1f}% ({c}/{t}) |")
          PY

  frontend:
    name: Frontend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Install dependencies
        run: cd frontend && pnpm install --frozen-lockfile

      - name: Type check
        run: cd frontend && pnpm type-check

      # Report-only: runs tests with coverage and posts a summary, never fails the build.
      - name: Unit tests + coverage
        run: cd frontend && pnpm test:coverage

      - name: Publish frontend coverage summary
        if: always()
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, pathlib
          p = pathlib.Path("frontend/coverage/coverage-summary.json")
          if not p.exists():
              print("_No frontend coverage report generated._"); raise SystemExit
          t = json.loads(p.read_text())["total"]
          print("### Frontend coverage (Vitest v8 · report-only)\n")
          print("| Metric | Coverage |")
          print("|---|---|")
          for label, key in [("Lines", "lines"), ("Statements", "statements"),
                             ("Branches", "branches"), ("Functions", "functions")]:
              m = t[key]; print(f"| {label} | {m['pct']}% ({m['covered']}/{m['total']}) |")
          PY
